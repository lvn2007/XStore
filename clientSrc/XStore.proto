syntax = "proto3";
option optimize_for = SPEED;
package XStore_Proto;

// ======== COMMAND directives section ========
enum requestType {
  INFOREQUEST = 0;
  UNARYREQUEST = 1;
  RANGEREQUEST = 2;
  CREATEDBREQUEST = 3;
  UNARYINSERT = 4;
  BATCHINSERT = 5;
}

message reqCMD {
  requestType rType = 1;
}

// ======== REQUESTS section ========
// --- UNARY request
message unaryQuery_REQ {
  requestType rType = 1;
  uint32 timestamp = 2;
  string dbName = 3;
}

// --- CREATE DB request
message createDB_REQ {
  requestType rType = 1;
  string dbName = 2;
  int32 rowLength = 3;
}

// --- UNARY insert request
message unaryInsert_REQ {
  requestType rType = 1;
  uint32 timestamp = 2;
  string data = 3;
  string dbName = 4;
}

// --- RANGE request
message rangeQuery_REQ {
  requestType rType = 1;
  uint32 startTime = 2;
  uint32 endTime = 3;
  string dbName = 4;
}

// ======== RESPONSE section ========
// --- DB Stats & Info REQ response
message dbStats {
  string dbName = 1;
  string dbResolution = 2;
  float totalSizeInGB = 3;
  repeated string fileName = 4;
}

message sysInfo_REP {
  string serverAddr = 1;
  int32 threadCount = 2;
  repeated dbStats dbInfo = 3;
}

// --- UNARY REQ response
message unaryQuery_REP {
  uint32 timestamp = 1;
  string dataset = 2;
  string queryStatus = 3;
}

// --- CREATE DB response
message createDB_REP {
  string createDBStatus = 1;
}

// --- UNARY INSERT REQ response
message unaryInsert_REP {
  string insertStatus = 1;
}

// --- RANGE/BATCH REQ response
message batchQuery_REP {
  repeated unaryQuery_REP unaryResponse = 1;
  string queryStatus = 2;
}