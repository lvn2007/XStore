syntax = "proto3";
option optimize_for = SPEED;
package XStore_Proto;

// ======== COMMAND directives section ========
enum requestType {
  INFOREQUEST = 0;
  UNARYREQUEST = 1;
  RANGEREQUEST = 2;
  CREATEDBREQUEST = 3;
  UNARYINSERT = 4;
  BATCHINSERT = 5;
  REMOVEDB = 6;
  REMOVEDBFILES = 7;
}

message reqCMD {
  requestType rType = 1;
}

// ======== REQUESTS section ========
// --- UNARY request
message unaryQuery_REQ {
  requestType rType = 1;
  uint64 timestamp = 2;
  string dbName = 3;
}

// --- CREATE DB request
message createDB_REQ {
  requestType rType = 1;
  string dbName = 2;
  string timeResolution = 3;
}

// --- UNARY insert request
message unaryInsert_REQ {
  requestType rType = 1;
  uint64 timestamp = 2;
  string data = 3;
  string dbName = 4;
}

message batchInsert_DATA {
  uint64 timestamp = 1;
  string data = 2;
  string dbName = 3;
}

// --- BATCH insert request
message batchInsert_REQ {
  requestType rType = 1;
  repeated batchInsert_DATA batchInsert_DATA = 2;
}

// --- RANGE request
message rangeQuery_REQ {
  requestType rType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
}

// --- REMOVE DB request
message removeDB_REQ {
  requestType rType = 1;
  string dbName = 2;
}

// --- REMOVE DB FILES request
message removeDBFiles_REQ {
  requestType rType = 1;
  string dbName = 2;
  repeated string fileName = 3;
}

// ======== RESPONSE section ========
// --- DB Stats & Info REQ response
message dbStats {
  string dbName = 1;
  string dbResolution = 2;
  uint64 totalSizeInByte = 3;
}

message sysInfo_REP {
  string serverAddr = 1;
  int32 threadCount = 2;
  repeated dbStats dbInfo = 3;
}

// --- UNARY REQ response
message unaryQuery_REP {
  uint64 timestamp = 1;
  string dataset = 2;
  string queryStatus = 3;
}

// --- CREATE DB response
message createDB_REP {
  string createDBStatus = 1;
}

// --- UNARY INSERT REQ response
message unaryInsert_REP {
  string insertStatus = 1;
}

// --- BATCH INSERT REQ response
message batchInsert_REP {
  repeated string insertStatus = 1;
}

// --- RANGE/BATCH REQ response
message batchQuery_REP {
  repeated unaryQuery_REP unaryResponse = 1;
  string queryStatus = 2;
}

// --- REMOVE DB response
message removeDB_REP {
  string removeStatus = 1;
}

// --- REMOVE DB FILES response
message removeDBFiles_REP {
  repeated string removeStatus = 1;
}