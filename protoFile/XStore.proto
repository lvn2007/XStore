syntax = "proto3";
option optimize_for = SPEED;
package XStore_Proto;

// ======== COMMAND directives section ========
enum requestType {
  INFO = 0;
  CREATEDB = 1;
  REMOVEDB = 2;
  REMOVEDBFILES = 3;
  UNARYINSERT = 4;
  UNARYQUERY = 5;
  UNARYDELETE = 6;
  BATCHINSERT = 7;
  BATCHQUERY = 8;
  BATCHDELETE = 9;
  RANGEINSERT = 10;
  RANGEQUERY = 11;
  RANGEDELETE = 12;
}

message reqCMD {
  requestType rType = 1;
}

// ======== REQUESTS section ========
// --- UNARY QUERY request
message unaryQuery_REQ {
  requestType rType = 1;
  uint64 timestamp = 2;
  string dbName = 3;
}

message unaryDelete_REQ {
  requestType rType = 1;
  uint64 timestamp = 2;
  string dbName = 3;
}

// --- CREATE DB request
message createDB_REQ {
  requestType rType = 1;
  string dbName = 2;
  string timeResolution = 3;
  uint32 rowLength = 4;
}

// --- UNARY insert request
message unaryInsert_REQ {
  requestType rType = 1;
  uint64 timestamp = 2;
  string data = 3;
  string dbName = 4;
}

message batchInsert_DATA {
  uint64 timestamp = 1;
  string data = 2;
}

// --- BATCH insert request
message batchInsert_REQ {
  requestType rType = 1;
  string dbName = 2;
  repeated batchInsert_DATA batchInsert_DATA = 3;
}

// --- BATCH query request
message batchQuery_REQ {
  requestType rType = 1;
  repeated uint64 timestamp = 2;
  string dbName = 3;
}

// --- RANGE request
message rangeQuery_REQ {
  requestType rType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
}

// --- REMOVE DB request
message removeDB_REQ {
  requestType rType = 1;
  string dbName = 2;
}

// --- REMOVE DB FILES request
message removeDBFiles_REQ {
  requestType rType = 1;
  string dbName = 2;
  repeated string fileName = 3;
}

// ======== RESPONSE section ========
// --- DB Stats & Info REQ response
message dbStats {
  string dbName = 1;
  string dbResolution = 2;
  uint64 totalSizeInByte = 3;
  repeated string fileName = 4;
}

// --- SYS INFO response
message sysInfo_REP {
  string serverAddr = 1;
  int32 threadCount = 2;
  repeated dbStats dbInfo = 3;
}

// --- UNARY QUERY response
message unaryQuery_REP {
  uint64 timestamp = 1;
  string dataset = 2;
}

// --- UNARY DELETE response
message unaryDelete_REP {
  string deleteStatus = 1;
}

// --- CREATE DB response
message createDB_REP {
  string createDBStatus = 1;
}

// --- UNARY INSERT response
message unaryInsert_REP {
  string insertStatus = 1;
}

// --- BATCH INSERT response
message batchInsert_REP {
  string insertStatus = 1;
}

// --- RANGE response
message rangeQuery_REP {
  repeated unaryQuery_REP queryResponse = 1;
}

// --- RANGE response
message batchQuery_REP {
  repeated unaryQuery_REP queryResponse = 1;
}

// --- REMOVE DB response
message removeDB_REP {
  string removeStatus = 1;
}

// --- REMOVE DB FILES response
message removeDBFiles_REP {
  repeated string removeStatus = 1;
}