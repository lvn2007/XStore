syntax = "proto3";

//option java_package = "ex.grpc";
option optimize_for = SPEED;

package xStoregRPC;

// Defines the service
service xStore {
  // Function invoked to send the request
  rpc unaryRequest (unaryRequestMsg) returns (responseData) {}
  rpc batchRequest (rangeRequestMsg) returns (stream responseData) {}
}

message recordSize {
  string dbName = 1;
  uint32 rowSize = 2;
}

message dbSizeRecord {
  repeated recordSize recordsize = 1;
}

// The request message containing requested numbers
message unaryRequestMsg {
  enum requestType {
    UNARY = 0;
    STREAM = 1;
  }
  requestType rType = 1;
  uint32 timestamp = 2;
  string dbName = 3;
}

message rangeRequestMsg {
  uint32 startTime = 1;
  uint32 endTime = 2;
  string dbName = 3;
}

// The response message containing response
message responseData {
  uint32 timestamp = 1;
  string dataset = 2;
}

message messageInfo {
  uint32 nItems = 1;
  uint32 msgLength = 2;
}