syntax = "proto3";

option optimize_for = SPEED;

package xstoreProto;

enum requestType {
  INFOREQUEST = 0;
  UNARYREQUEST = 1;
  RANGEREQUEST = 2;
  UNARYINSERT = 3;
  BATCHINSERT = 4;
}

// --- DB Stats & Info
message dbStats {
  string dbName = 1;
  string dbResolution = 2;
  float totalSizeInGB = 3;
  repeated string fileName = 4;
}

message infoResponse {
  string serverAddr = 1;
  int32 threadCount = 2;
  repeated dbStats dbInfo = 3;
}
// --- DB Stats & Info

// REQUEST section
//  COMMAND directive
message reqCMD {
  requestType rType = 1;
}

//  UNARY request
message unaryRequest {
  requestType rType = 1;
  uint32 timestamp = 2;
  string dbName = 3;
}

//  RANGE request
message rangeRequest {
  requestType rType = 1;
  uint32 startTime = 2;
  uint32 endTime = 3;
  string dbName = 4;
}

// RESPONSE section
//  UNARY response
message unaryResponse {
  uint32 timestamp = 1;
  string dataset = 2;
  string queryStatus = 3;
}

message batchResponse {
  repeated unaryResponse unaryResponse = 1;
  string queryStatus = 2;
}