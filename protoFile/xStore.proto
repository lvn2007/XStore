syntax = "proto3";

option optimize_for = SPEED;

package xstoreProto;

// Defines the service - gRPC only
//service xStore {
//  // Function invoked to send the request
//  rpc unaryRequest (unaryRequestMsg) returns (responseData) {}
//  rpc batchRequest (rangeRequestMsg) returns (stream responseData) {}
//}

enum requestType {
  UNARYREQUEST = 0;
  BATCHREQUEST = 1;
  UNARYINSERT = 2;
  BATCHINSERT = 3;
}

message reqCMD {
  requestType rType = 1;
}

// REQUEST section
//  UNARY request
message unaryRequest {
  requestType rType = 1;
  uint32 timestamp = 2;
  string dbName = 3;
}

//  RANGE request
message rangeRequest {
  requestType rType = 1;
  uint32 startTime = 2;
  uint32 endTime = 3;
  string dbName = 4;
}

// RESPONSE section
//  UNARY response
message unaryResponse {
  uint32 timestamp = 1;
  string dataset = 2;
  string queryStatus = 3;
}

message batchResponse {
  repeated unaryResponse unaryResponse = 1;
  string queryStatus = 2;
}