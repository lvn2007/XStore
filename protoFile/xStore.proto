syntax = "proto3";

//option java_package = "ex.grpc";

package xStoregRPC;

// Defines the service
service xStore {
  // Function invoked to send the request
  rpc sendRequest (unaryRequest) returns (responseData) {}
  rpc batchRequest (rangeRequest) returns (stream responseData) {}
}

// The request message containing requested numbers
message unaryRequest {
  uint32 timestamp = 1;
}

message rangeRequest {
  uint32 startTime = 1;
  uint32 endTime = 2;
}

// The response message containing response
message responseData {
  string dataset = 1;
}