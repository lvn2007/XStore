syntax = "proto3";

//option java_package = "ex.grpc";

package mathtest;

// Defines the service
service MathTest {
  // Function invoked to send the request
  rpc sendRequest (MathRequest) returns (MathReply) {}
  rpc batchRequest (rangeRequest) returns (stream MathReply) {}
}

// The request message containing requested numbers
message MathRequest {
  uint32 timeStamp = 1;
}

message rangeRequest {
  uint32 startTime = 1;
  uint32 endTime = 2;
}

// The response message containing response
message MathReply {
  string dataset = 1;
}