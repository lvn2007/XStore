syntax = "proto3";
option optimize_for = SPEED;
package XStore_Proto;

// Language-specific options, consumed only by their respective generators
// (ignored by the C++/C/Python bindings). java_package + java_multiple_files
// keep the Java bindings in a named package instead of the illegal default
// package; go_package gives the Go bindings a stable import path.
option java_package = "org.it.xstore.proto";
option java_multiple_files = true;
option go_package = "xstore/proto";

// ======== COMMAND directives section ========
enum RequestType {
  INFO = 0;
  CREATEDB = 1;
  REMOVEDB = 2;
  REMOVEDBFILES = 3;
  UNARYINSERT = 4;
  UNARYQUERY = 5;
  UNARYDELETE = 6;
  BATCHINSERT = 7;
  BATCHQUERY = 8;
  BATCHDELETE = 9;
  RANGEINSERT = 10;
  RANGEQUERY = 11;
  RANGEDELETE = 12;
  MIN = 13;
  MAX = 14;
  SUM = 15;
  AVG = 16;
  PING = 17;
  VARIANCE = 18;
  STDDEV = 19;
  EXISTS = 20;
  OHLC = 21;
  PERCENTILE = 22;
  DISTINCTCOUNT = 23;
  TOPK = 24;
  FINDBYVALUE = 25;
  FINDBYPATTERN = 26;
}

enum TimeUnit {
  SECOND = 0;
  MILLISECOND = 1;
  MICROSECOND = 2;
  NANOSECOND = 3;
  MINUTE = 4;
  HOUR = 5;
  DAY = 6;
}

// Durability mode for a single write. Zero-value (ASYNC) is the intended
// default -- lowest latency, no fsync wait; a client that omits this field
// gets ASYNC, not a durability guarantee. Pass SYNC explicitly to opt into
// durability.
//
// Collapsed from four modes (ASYNC_ONLY/GROUP_COMMIT/SYNC_PER_COMMIT/BYPASS)
// down to three: GROUP_COMMIT and SYNC_PER_COMMIT differed only in whether a
// commit forced an immediate flush vs. rode the adaptive gather window --
// the window already self-tunes toward its MIN for a lone writer (see
// WAL_GATHER_WINDOW_MIN_US/MAX_US in XStore_Tunables.h), so a caller-visible
// choice between the two bought nothing a client could reason about that the
// adaptive logic wasn't already doing. SYNC now covers both; the low-vs-
// high-concurrency tradeoff is purely an internal tuning knob, not a wire
// contract callers need to pick between.
//
// BYPASS skips WAL entirely -- no queue, no CRC32, no second write. For
// UnaryInsert, the row is pwrite()'d straight to the data file on the
// calling (ZMQ worker) thread, same as ASYNC's eventual apply but with no
// WAL record ever written for it. Durability window is therefore bounded by
// the OS's own writeback timing (dirty_expire_centisecs, default ~30s), NOT
// by a fast WAL fdatasync like ASYNC gets -- meaningfully weaker than
// ASYNC's existing bound, not an upgrade from it. No corruption risk the way
// SYNC bypassed entirely (fsync=off-style) would have, since XStore's flat
// offset-addressed row layout has no cross-referencing structure for an
// ordering inversion to break -- worst case is exactly the row(s) in flight
// at crash time being stale/lost, nothing else. Explicit opt-in only, never
// a default.
enum WalDurabilityMode {
  ASYNC  = 0;
  SYNC   = 1;
  BYPASS = 2;
}

message ConfigStruct {
  string dbName = 1;
  TimeUnit timeResolution = 2;
  sfixed32 rowLength = 3;
  // Persisted current high-water mark of "highest populated column index +
  // 1" ever observed for this DB, auto-updated on insert (never enforced).
  // Sizes the zone map's tracked-column cap for this DB, replacing the
  // single global ZONE_MAP_MAX_TRACKED_COLUMNS default. 0 = never grown
  // past the global default.
  uint32 columnCount = 4;
  // Optional per-index column names, purely an API-boundary convenience --
  // never touches wire encoding, storage layout, or zone-map internals
  // (column_idx stays the only thing those ever see). columnNames[i] names
  // column index i; empty = today's pure-positional behavior. Persisted
  // here so any client (including a fresh process after restart) can
  // rediscover the mapping via InfoRequest's DbStats, which mirrors this
  // field the same way it already mirrors rowLength.
  repeated string columnNames = 5;
}

message FData {
  oneof oneOfData {
    double doubleData = 1;
    float floatData = 2;
    int32 int32Data = 3;
    int64 int64Data = 4;
    uint32 uint32Data = 5;
    uint64 uint64Data = 6;
    sint32 sint32Data = 7;
    sint64 sint64Data = 8;
    fixed32 fixed32Data = 9;
    fixed64 fixed64Data = 10;
    sfixed32 sfixed32Data = 11;
    sfixed64 sfixed64Data = 12;
    bool boolData = 13;
    string stringData = 14;
    bytes bytesData = 15;
  }
}

message RowData {
  repeated FData fieldData = 1;
}

message MultipleRowData {
  repeated RowData rData = 1;
}

message ReqCMD {
  RequestType RType = 1;
}

// ======== REQUESTS section ========
// --- CREATE DB request
message CreateDB_REQ {
  RequestType RType = 1;
  string dbName = 2;
  TimeUnit timeResolution = 3;
  uint32 rowLength = 4;
  // Optional seed for the zone-map tracked-column high-water mark (see
  // ConfigStruct.columnCount below). 0 = unseeded, purely auto-tracked from
  // observed inserts. Never enforced against insert width -- see the
  // 2026-09-15 design doc's "Per-DB column count" section.
  uint32 columnCount = 5;
  // Client-supplied names for the columns it plans to use, forwarded
  // as-is into ConfigStruct.columnNames -- see that field's comment.
  repeated string columnNames = 6;
}

// --- REMOVE DB request
message RemoveDB_REQ {
  RequestType RType = 1;
  string dbName = 2;
}

// --- REMOVE DB FILES request
message RemoveDBFiles_REQ {
  RequestType RType = 1;
  string dbName = 2;
  repeated string fileName = 3;
}

// --- UNARY INSERT
message UnaryInsert_REQ {
  RequestType RType = 1;
  uint64 timestamp = 2;
  RowData data = 3;
  string dbName = 4;
  WalDurabilityMode durabilityMode = 5;
}

// --- UNARY QUERY
message UnaryQuery_REQ {
  RequestType RType = 1;
  uint64 timestamp = 2;
  string dbName = 3;
}

// --- UNARY DELETE
message UnaryDelete_REQ {
  RequestType RType = 1;
  uint64 timestamp = 2;
  string dbName = 3;
}

// --- BATCH INSERT (DATA)
message BatchInsert_DATA {
  uint64 timestamp = 1;
  RowData data = 2;
}

// --- BATCH INSERT
// durabilityMode now routes through the same WAL EnqueueWalRecord/
// ApplyWalRecord path UnaryInsert uses (one WalRecord per year-bucket
// group) -- SYNC blocks until durably fsync'd and applied, ASYNC enqueues
// and returns immediately (both the fsync AND the data-file write itself
// are deferred to the WAL writer thread, unlike the old direct-write
// path), BYPASS applies straight to the data file on this thread with no
// WAL record at all, same as UnaryInsert's BYPASS.
message BatchInsert_REQ {
  RequestType RType = 1;
  string dbName = 2;
  repeated BatchInsert_DATA batchInsert_DATA = 3;
  WalDurabilityMode durabilityMode = 4;
}

// --- BATCH QUERY
message BatchQuery_REQ {
  RequestType RType = 1;
  repeated uint64 timestamp = 2;
  string dbName = 3;
  bool SortTime = 4;
}

// --- BATCH DELETE
message BatchDelete_REQ {
  RequestType RType = 1;
  repeated uint64 timestamp = 2;
  string dbName = 3;
}

// --- RANGE INSERT (DATA)
// LEGACY ALIAS of BatchInsert, kept on the wire only for old clients: the server runs both RPCs through the same
// code (XStore::MultiRowInsert) with identical semantics, and the client libraries in client_src no longer expose
// it -- new code sends BatchInsert_REQ. Still sent by: the XBench `ingest` command (external repo, older client
// copy). See docs/XStore_Technical_Reference.md, "RangeInsert compatibility".
message RangeInsert_DATA {
  uint64 timestamp = 1;
  RowData data = 2;
}

// --- RANGE INSERT
// durabilityMode: same WAL-routed semantics as BatchInsert_REQ's field
// above (see its comment).
message RangeInsert_REQ {
  RequestType RType = 1;
  string dbName = 2;
  repeated RangeInsert_DATA rangeInsert_DATA = 3;
  WalDurabilityMode durabilityMode = 4;
}

// --- RANGE QUERY
message RangeQuery_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
}

// --- RANGE DELETE
message RangeDelete_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
}

// --- MIN
message Min_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
}

// --- MAX
message Max_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
}

// --- SUM
message Sum_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
}

// --- AVG
message Avg_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
}

// --- VARIANCE
message Variance_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
}

// --- STDDEV
message Stddev_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
}

// --- EXISTS: does at least one row in [startTime, endTime] have a
// non-null/numeric value for columnIdx? Short-circuits on the zone map's
// existing valid_count field (no new persisted field, no version bump) --
// a block with valid_count > 0 proves existence with zero row scan; a
// block with valid_count == 0 is skipped outright.
message Exists_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
}

// --- FINDBYVALUE: equality lookup for columnIdx == value over
// [startTime, endTime], accelerated by the .catidx sidecar (bloom filter +
// roaring bitmap). Reply reuses UnaryQuery_REP's exact wire shape
// ({timestamp, data} per matching row), field-numbered identically to
// RangeQuery_REP.
message FindByValue_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
  FData value = 6;
}

// --- FINDBYPATTERN: string pattern match on one column over
// [startTime, endTime]. Only stringData/bytesData values can match; any other
// FData type, a missing column, or an unwritten row never matches.
// TEMPORARY IMPLEMENTATION (option A): the server answers this with a
// brute-force per-row scan, no index. This message/RPC shape is intended to
// be permanent; the scan behind it is a baseline pending the A (scan) vs.
// B (per-block trigram bloom) vs. C (inverted index) decision -- see TODO.md.
// Reply reuses UnaryQuery_REP's wire shape, like FindByValue_REP.
enum PatternMode {
  PATTERN_LIKE = 0;   // SQL LIKE: % = any run of bytes, _ = exactly one byte, \ escapes the next byte. Whole-value match.
  PATTERN_REGEX = 1;  // RE2 syntax, UTF-8, unanchored (partial) match. Requires a server built with RE2.
}

message FindByPattern_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
  bytes pattern = 6;          // bytes, not string: a LIKE pattern for a bytesData column need not be valid UTF-8
  PatternMode mode = 7;
  bool caseInsensitive = 8;   // LIKE: ASCII-only fold (ILIKE). REGEX: RE2 case_sensitive=false.
}

// --- OHLC: open/high/low/close bar over [startTime, endTime] for columnIdx.
// Open/Close are the chronologically first/last numeric values in range (not
// value-extremes -- see ZoneMapEntry's first_value/last_value, new in v3);
// High/Low are the existing value-extremes (ZoneMapEntry.max_value/min_value,
// same fields MIN/MAX already use). All four returned together from one
// block walk rather than as three separate ops.
message Ohlc_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
}

// --- PERCENTILE: exact linear-interpolated percentile (PERCENTILE_CONT
// semantics -- same interpolation numpy.percentile/most SQL engines default
// to) of columnIdx's real values over [startTime, endTime]. percentile is
// 0.0-1.0 (0.5 = median). Exact, not zone-map-accelerated: requires
// collecting every real value in range and sorting, same cost/memory
// tradeoff as any SQL engine's exact ordered-set aggregate (Postgres
// PERCENTILE_CONT, etc.) -- deliberately not the approximate/sketch-based
// (t-digest/KLL) version, which is separate future work (see TODO.md).
message Percentile_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
  double percentile = 6;
}

// --- DISTINCTCOUNT: exact count of distinct real values of columnIdx over
// [startTime, endTime]. Exact, not zone-map-accelerated: builds a real hash
// set of every value in range, same cost/memory tradeoff as SQL's
// COUNT(DISTINCT x) -- deliberately not the approximate (HyperLogLog)
// version, which is separate future work (see TODO.md).
message DistinctCount_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
}

// --- TOPK: the k most-frequent real values of columnIdx over [startTime,
// endTime], most-frequent first (ties broken by ascending value, for
// determinism). Mode is TopK with k=1 -- one op, not a separate MODE op,
// same "don't split what's one computation" precedent OHLC used for
// open/high/low/close. Exact, not zone-map-accelerated: builds a real
// frequency hash map over every value in range, same cost/memory tradeoff
// as SQL's GROUP BY ... ORDER BY COUNT(*) DESC LIMIT k -- deliberately not
// the approximate (Count-Min Sketch/Space-Saving) version, which is
// separate future work (see TODO.md).
message TopK_REQ {
  RequestType RType = 1;
  uint64 startTime = 2;
  uint64 endTime = 3;
  string dbName = 4;
  sint32 columnIdx = 5;
  uint32 k = 6;
}

// --- Envelope: one wire message carries exactly one of these. The oneof
// case (payload_case()) replaces RType as the dispatch tag, so a request
// only needs to be parsed once server-side.
message Request {
  oneof payload {
    ReqCMD info = 1;
    CreateDB_REQ createdb = 2;
    RemoveDB_REQ removedb = 3;
    RemoveDBFiles_REQ removedbfiles = 4;
    UnaryInsert_REQ unaryinsert = 5;
    UnaryQuery_REQ unaryquery = 6;
    UnaryDelete_REQ unarydelete = 7;
    BatchInsert_REQ batchinsert = 8;
    BatchQuery_REQ batchquery = 9;
    BatchDelete_REQ batchdelete = 10;
    RangeInsert_REQ rangeinsert = 11;
    RangeQuery_REQ rangequery = 12;
    RangeDelete_REQ rangedelete = 13;
    Min_REQ min = 14;
    Max_REQ max = 15;
    Sum_REQ sum = 16;
    Avg_REQ avg = 17;
    ReqCMD ping = 18;
    Variance_REQ variance = 19;
    Stddev_REQ stddev = 20;
    Exists_REQ exists = 21;
    Ohlc_REQ ohlc = 22;
    Percentile_REQ percentile = 23;
    DistinctCount_REQ distinctcount = 24;
    TopK_REQ topk = 25;
    FindByValue_REQ findbyvalue = 26;
    FindByPattern_REQ findbypattern = 27;
  }
}

// ======== RESPONSE section ========
// --- DB Stats & Info REP
// Per-file size, both actual (real disk usage, sparse-hole-aware) and
// apparent (logical/reported size, what a sparse file's holes count as if
// they held real bytes) -- see InfoQuery's st_blocks vs st_size comment.
message FileStats {
  string fileName            = 1;
  uint64 actualSizeBytes     = 2; // st_blocks * 512 -- real bytes on disk
  uint64 apparentSizeBytes   = 3; // st_size -- logical size, >= actualSizeBytes for a sparse file
}

message DbStats {
  string dbName = 1;
  TimeUnit dbResolution = 2;
  uint64 totalSizeInByte = 3; // sum of every file's actualSizeBytes -- real disk usage of this DB
  repeated FileStats files = 4;
  // Configured per-row slot size (bytes), from this DB's CFG (matches
  // ConfigStruct.rowLength). Every row is serialized RowData zero-padded to
  // exactly this many bytes -- xstore-viewer's sizing diagnostic
  // (tools/xstore-viewer/src/convert.rs's formulaMax + frontend/app.js's
  // slotBadge()) compares this against real rows' actual serialized size to
  // flag wasted padding, and separately whether rowLength itself is a
  // multiple of the 8-byte slot-alignment unit. It can only ever detect
  // those two things -- never "data doesn't fit": XStore rejects (never
  // truncates) any insert whose serialized size exceeds rowLength, so an
  // oversized row can never reach disk to be sampled by this diagnostic in
  // the first place.
  sfixed32 rowLength = 5;
  // Mirrors ConfigStruct.columnNames -- lets any client (a different
  // process, or the same one after restart) rediscover a DB's name->index
  // mapping via InfoRequest instead of only at CreateDB time. Empty if the
  // DB was created without names.
  repeated string columnNames = 6;
}

// --- SYS INFO
message SysInfo_REP {
  string serverAddr = 1;
  int32 threadCount = 2;
  repeated DbStats dbInfo = 3;
}

// --- PING: empty ack, no server-side work beyond the round trip. Used to
// force the ZMTP handshake (warmup) without InfoQuery's directory scan.
message Ping_REP {
}

// --- SYS STATS: host-level resource snapshot, broadcast over a dedicated
// PUB socket (default port = main port - 1) -- NOT part of the
// Request/Response RPC envelope above, so there is no matching
// RequestType/Request.oneof entry. The server's background collector
// thread (SysStatsCollector, XStore_SysStats.*) serializes one of these
// directly onto the wire every SYS_STATS_COLLECT_INTERVAL_MS regardless of
// subscriber count; a client just connects a ZMQ_SUB socket and decodes
// each incoming frame as this message.
message SysStats_PUB {
  double cpuUtilPercent = 1;  // 0-100, delta since the previous tick
  uint64 memTotalBytes  = 2;
  uint64 memUsedBytes   = 3;  // MemTotal - MemAvailable
  double netRxKBps      = 4;  // summed across non-loopback interfaces
  double netTxKBps      = 5;
  uint64 diskReadIOPS   = 6;  // block device backing the data store dir
  uint64 diskWriteIOPS  = 7;
  uint64 diskFreeBytes  = 8;
  uint64 diskTotalBytes = 9;
  uint64 snapshotUnixMs = 10; // collector's sample time -- staleness check
}

// --- CREATE DB response
message CreateDB_REP {
  string createDBStatus = 1;
}

// --- REMOVE DB
message RemoveDB_REP {
  string removeStatus = 1;
}

// --- REMOVE DB FILES
message RemoveDBFiles_REP {
  repeated string removeStatus = 1;
}

// --- UNARY INSERT
message UnaryInsert_REP {
  string insertStatus = 1;
}

// --- UNARY QUERY
message UnaryQuery_REP {
  uint64 timestamp = 1;
  RowData data = 2;
  optional string queryStatus = 3;
}

// --- UNARY DELETE
message UnaryDelete_REP {
  string deleteStatus = 1;
}

// --- BATCH INSERT
message BatchInsert_REP {
  string insertStatus = 1;
}

// --- BATCH QUERY
message BatchQuery_REP {
  repeated UnaryQuery_REP queryResponse = 1;
  optional string queryStatus = 3;
}

// --- BATCH DELETE
message BatchDelete_REP {
  string deleteStatus = 1;
}

// --- RANGE INSERT
message RangeInsert_REP {
  string insertStatus = 1;
}

// --- RANGE QUERY
message RangeQuery_REP {
  repeated UnaryQuery_REP queryResponse = 1;
  optional string queryStatus = 3;
}

// --- RANGE DELETE
message RangeDelete_REP {
  string deleteStatus = 1;
}

// --- MIN
message Min_REP {
  FData opResult = 1;
  string opStatus = 2;
}

// --- MAX
message Max_REP {
  FData opResult = 1;
  string opStatus = 2;
}

// --- SUM
message Sum_REP {
  double opResult = 1;
  string opStatus = 2;
}

// --- AVG
message Avg_REP {
  double opResult = 1;
  string opStatus = 2;
}

// --- VARIANCE
message Variance_REP {
  double opResult = 1;
  string opStatus = 2;
}

// --- STDDEV
message Stddev_REP {
  double opResult = 1;
  string opStatus = 2;
}

// --- EXISTS
message Exists_REP {
  string opStatus = 1;
  bool exists = 2;
}

// --- FINDBYVALUE
message FindByValue_REP {
  repeated UnaryQuery_REP queryResponse = 1;
  optional string queryStatus = 3;
}

// --- FINDBYPATTERN
message FindByPattern_REP {
  repeated UnaryQuery_REP queryResponse = 1;
  optional string queryStatus = 3;
}

// --- OHLC
message Ohlc_REP {
  string opStatus = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
}

// --- PERCENTILE
message Percentile_REP {
  string opStatus = 1;
  double value = 2;
}

// --- DISTINCTCOUNT
message DistinctCount_REP {
  string opStatus = 1;
  uint64 count = 2;
}

// --- TOPK
message TopKEntry {
  double value = 1;
  uint64 count = 2;
}
message TopK_REP {
  string opStatus = 1;
  repeated TopKEntry entries = 2;
}
