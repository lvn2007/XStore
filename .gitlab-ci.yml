variables:
  containerName: "ciRunner"
  snapshotName: "freshSnapshot"

stages:          # List of stages for jobs, and their order of execution
  - Initialize
  - OS Configurations
  - Build
  - Test
  - Cleanup

default:
  tags: ['LXC_Runner']

init-lxc:
  stage: Initialize
  script:
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Restoring ${containerName} to ${snapshotName}"
    - lxc restore ${containerName} ${snapshotName}     # Restore to initial snapshot
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Successfully restored ${containerName} to ${snapshotName}"
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Starting LXC container"
    - lxc start ${containerName}                      # Start LXC container
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- ${containerName} has been initialized successfully"
  tags:
    - LXC_Controller                                  # SHELL runner inside of VM

update-os:
  stage: OS Configurations
  script:
    - sudo apt-get update && sudo apt-get upgrade -y

install-deps:
  stage: OS Configurations
  needs:
    - job: "update-os"
  script:
    - sudo apt install build-essential cmake g++ protobuf-compiler libzmq3-dev -y         # XStore specifics

compile-server:
  stage: Build
  script:
    - mkdir build && cd build
    - cmake .. && make && cd ../..
    - mkdir ~/XStore_Server ~/XStore_Server/build ~/XStore_Server/dataStore
    - cp -r xStore/build/* ~/XStore_Server/build              # Copy to designated home folder so won't get cleaned-up by runner

compile-client:
  stage: Build
  needs:
    - job: "compile-server"
  script:
    - cd clientSrc && mkdir build && cd build
    - cmake .. && make && cd ../../..
    - mkdir ~/XStore_Client ~/XStore_Client/build
    - cp -r xStore/clientSrc/build/* ~/XStore_Client/build    # Copy to designated home folder so won't get cleaned-up by runner

build-test-server:
  stage: Test
  script:
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Starting build test for XStore (SERVER)"
    - cd ~/XStore_Server/build
    - ./XStore 127.0.0.1 12345 2 &                            # Run SERVER in foreground
    - sleep 10                                                # Let SERVER runs for at least 10s
    - kill %1                                                 # Terminate SERVER
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Build test for XStore (SERVER) has concluded"

build-test-client:
  stage: Test
  needs:
    - job: "build-test-server"
  script:
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Starting build test for XStore (CLIENT)"
    - cd ~/XStore_Client/build
    - ./XStore_Client 127.0.0.1 12345 TEST BUILD              # Run CLIENT in foreground
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Build test for XStore (CLIENT) has concluded"

sysinfo-test:
  stage: Test
  needs:
    - job: "build-test-client"
  script:
    - cd ~/XStore_Server/build
    - ./XStore 127.0.0.1 12345 2 &                            # Run SERVER in foreground
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Starting build test for XStore (CLIENT)"
    - cd ~/XStore_Client/build
    - ./XStore_Client 127.0.0.1 12345 TEST SYS_INFO           # Run CLIENT in foreground
    - kill %1                                                 # Terminate SERVER
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Build test for XStore (CLIENT) has concluded"

cleanup-lxc:
  stage: Cleanup
  script:
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Stopping ${containerName}"
    - lxc stop ciRunner                                       # Stopping LXC container
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- ${containerName} has been turned off successfully"
  tags:
    - LXC_Controller
  when: always                                                # Cleanup regardless
