# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

variables:
  containerName: "ciRunner"
  snapshotName: "afterCIconfigs"

stages:          # List of stages for jobs, and their order of execution
  - Initialize VM
  - OS Configurations
  - Build
  - Test
  - Finalize VM

default:
  tags: ['LXC_Container']

configure-vm:
  stage: Initialize VM
  script:
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Restoring ${containerName} to ${snapshotName}"
    - lxc restore ${containerName} ${snapshotName}     # Restore to initial snapshot
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Successfully restored ${containerName} to ${snapshotName}"
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Starting LXC container"
    - lxc start ${containerName}                      # Start LXC container
    - sleep 2
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- ${containerName} has been initialized successfully"
  tags:
    - LXC_Controller                                                    # SHELL runner

update-os:
  stage: OS Configurations
  script:
    - sudo apt-get update && sudo apt-get upgrade -y

install-deps:
  stage: OS Configurations
  needs:
    - job: "update-os"
  script:
    - sudo apt install build-essential cmake g++ protobuf-compiler libzmq3-dev -y         # XStore specifics

compile-server:
  stage: Build
  script:
    - ls
    - mkdir build dataStore && cd build
    - ls
    - cmake .. && make
    - ls
    - cd ../.. && mv xStore ~

compile-client:
  stage: Build
  needs:
    - job: "compile-server"
  script:
    - ls
    - echo "Compiling client"

build-test:
  stage: Test
  script:
    - cd ~ && cd xStore && cd build
    - ./XStore &                              # Run XStore Server in foreground
    - sleep 10                                # Let XStore runs for at least 10s
    - kill %1                                 # Terminate XStore

cleanup-vm:
  stage: Finalize VM
  script:
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- Stopping ${containerName}"
    - lxc stop ciRunner                       # Stopping LXC container
    - echo "[INFO - `date +'%m-%d-%Y'` `date +'%r'`] -- ${containerName} has been turned off successfully"
  tags:
    - LXC_Controller
  when: always                                                 # Cleanup regardless

